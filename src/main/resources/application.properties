spring.application.name=Sales-Savvy

server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/sales-savvy
spring.datasource.username=enter your user name
spring.datasource.password=enter your password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# JWT Configuration
jwt.secret=secret_value
jwt.expiration=3600000


# CORS Configuration
spring.web.cors.allowed-origin-patterns=http://localhost:5174
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600
RAZORPAY_KEY_ID=rzp_test_your_key_here
RAZORPAY_KEY_SECRET=your_secret_here
